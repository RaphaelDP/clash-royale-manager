# Date Created: 2026-06-06
# Last Modified: 2026-08-06
# Version: 0.5.0
# Dependencies: Docker
# ================================================================================

services:
  app: 
    user: "${UID:-1000}:${GID:-1000}"  # Use host user and group IDs
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8501:8501"  # Streamlit
      - "8000:8000"  # FastAPI
    environment:
          - PYTHONPATH=/app
    volumes:
      - ./data:/app/data  # Persist database files
      - ./logs:/app/logs  # Persist logs
    restart: unless-stopped