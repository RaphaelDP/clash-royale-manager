# ================================================================================
# Filename: docker-compose.yml
# Description: Docker Compose configuration for the Clan Manager Dashboard.
# Author: Raphael Smilet
# Date Created: 2026-06-06
# Last Modified: 2026-10-05
# Version: 0.5.2
# Dependencies: Docker
# ================================================================================

services:
  app: 
    user: "${CLAN_UID:-1000}:${CLAN_GID:-1000}"  # Use host user and group IDs
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8501:8501"  # Streamlit
    environment:
          - PYTHONPATH=/app
    volumes:
      - ./data:/app/data  # Persist database files
      - ./logs:/app/logs  # Persist logs
      - ./backups:/app/backups  # Persist backups across container replacement
    init: true
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: on-failure
