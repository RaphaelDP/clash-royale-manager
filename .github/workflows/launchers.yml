# Filename: launchers.yml
# Description: Build standalone desktop apps and optional Docker launchers.
# Author: Raphael Smilet
# Date Created: 2026-10-06
# Last Modified: 2026-10-07
# Version: 0.4.0
name: Desktop launchers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: make ci
      - run: pip install reportlab==4.4.4
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: python -m scripts.build_user_guides
      - run: python -m scripts.package_release --output dist/project.zip
      - uses: actions/upload-artifact@v4
        with:
          name: project-source
          path: dist/project.zip
          if-no-files-found: error
  build:
    name: Optional Docker launcher
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller==6.16.0 python-dotenv==1.2.2 resvg-py==0.5.0 Pillow==12.0.0
      - run: python -m launch.build_icons
      - name: Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --paths . --add-data "${{ github.workspace }}/launch/clan-manager.png:." --specpath build --onefile --windowed --icon "${{ github.workspace }}/launch/windows/clan-manager.ico" --name windows_launcher --distpath launch/windows launch/launcher.py
          $process = Start-Process launch/windows/windows_launcher.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Launcher smoke test failed' }
      - name: macOS application
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --clean --paths . --add-data "${{ github.workspace }}/launch/clan-manager.png:." --specpath build --windowed --icon "${{ github.workspace }}/launch/macos/clan-manager.icns" --name macos_launcher --distpath launch/macos launch/launcher.py
          launch/macos/macos_launcher.app/Contents/MacOS/macos_launcher --smoke-test
          ditto -c -k --sequesterRsrc --keepParent launch/macos/macos_launcher.app launch/macos/macos_launcher.app.zip
      - name: Linux AppImage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils xvfb
          python -m PyInstaller --noconfirm --clean --paths . --add-data "${{ github.workspace }}/launch/clan-manager.png:." --specpath build --onedir --name linux_launcher --distpath build/native launch/launcher.py
          mkdir -p build/Launcher.AppDir/usr
          cp -a build/native/linux_launcher build/Launcher.AppDir/usr/
          cp launch/linux/AppRun launch/linux/clan-manager.desktop launch/clan-manager.svg build/Launcher.AppDir/
          chmod +x build/Launcher.AppDir/AppRun
          curl --fail --location --retry 3 https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o build/appimagetool
          chmod +x build/appimagetool
          ARCH=x86_64 build/appimagetool --appimage-extract-and-run build/Launcher.AppDir launch/linux/linux_launcher.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 launch/linux/linux_launcher.AppImage --self-test
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a launch/linux/linux_launcher.AppImage --smoke-test
          tar -czf launch/linux/linux_launcher.AppImage.tar.gz -C launch/linux linux_launcher.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.os }}
          path: |
            launch/windows/windows_launcher.exe
            launch/macos/macos_launcher.app.zip
            launch/linux/linux_launcher.AppImage.tar.gz
          if-no-files-found: error
  standalone:
    name: Standalone desktop
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller==6.16.0 python-dotenv==1.2.2 uv
      - uses: actions/download-artifact@v4
        with:
          name: project-source
          path: build/source
      - name: Build bundled runtime
        shell: bash
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path
          import subprocess
          import sys
          from zipfile import ZipFile
          with ZipFile("build/source/project.zip") as archive:
              for language in ("en", "fr"):
                  name = f"docs/user-guide-{language}.pdf"
                  Path(name).write_bytes(archive.read(name))
          runtime_dir = Path("build/python").resolve()
          subprocess.run(["uv", "python", "install", "3.12", "--install-dir", str(runtime_dir), "--no-bin"], check=True)
          installations = {p.resolve() for p in runtime_dir.glob("cpython-*") if p.is_dir()}
          assert len(installations) == 1
          runtime = installations.pop()
          python = runtime / ("python.exe" if os.name == "nt" else "bin/python3")
          subprocess.run(["uv", "--no-cache", "pip", "install", "--break-system-packages",
                          "--python", str(python), "-r", "requirements.txt"], check=True)
          subprocess.run([sys.executable, "-m", "scripts.build_standalone",
                          "--python-dir", str(runtime)], check=True)
          PYCODE
      - name: Test bundled application lifecycle
        run: python -m scripts.smoke_standalone dist/ClanManager
      - name: Linux GUI check
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a dist/ClanManager/ClanManager --smoke-test --data-dir build/gui-smoke
      - name: Windows GUI check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process dist/ClanManager/ClanManager.exe -ArgumentList '--smoke-test', '--data-dir', 'build/gui-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Standalone GUI smoke test failed' }
      - name: Archive complete standalone application
        shell: bash
        run: |
          python - <<'PYCODE'
          import os
          import shutil
          from app import __version__
          platform = "windows" if os.name == "nt" else "linux-x86_64"
          shutil.make_archive(f"dist/clan-manager-v{__version__}-standalone-{platform}",
                              "zip", "dist", "ClanManager")
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.os }}
          path: dist/*-standalone-*.zip
          if-no-files-found: error
  package:
    name: Assemble complete downloads
    needs: [checks, build, standalone]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Prepare matching assets and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from app import __version__
          from scripts.bundle_release import build_bundles

          tag = os.environ["RELEASE_TAG"]
          if os.environ["GITHUB_REF"].startswith("refs/tags/"):
              assert tag.replace("-rc.", "rc") == f"v{__version__}", "Tag/version mismatch"
          else:
              tag = f"v{__version__}"
          build_bundles(Path("release-artifacts"), Path("release-assets"), __version__)
          import hashlib
          import shutil
          for group, platform in (("standalone-windows-2022", "windows"), ("standalone-ubuntu-22.04", "linux-x86_64")):
              name = f"clan-manager-v{__version__}-standalone-{platform}.zip"
              matches = list((Path("release-artifacts") / group).rglob(name))
              assert len(matches) == 1
              shutil.copy2(matches[0], Path("release-assets") / name)
          assets = sorted(p for p in Path("release-assets").iterdir() if p.name != "SHA256SUMS.txt")
          Path("release-assets/SHA256SUMS.txt").write_text(
              "".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n" for p in assets))

          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/blob/{tag}"
          Path("release-notes.md").write_text(
              f"# Clash Royale Clan Manager {tag}\n\n"
              "Clan dashboard, historical data, contribution recommendations, scheduled collection, "
              "backups, and native Docker launchers. Training and battle phases share each weekly race.\n\n"
              f"[English user guide]({base}/docs/user-guide.md#english) · "
              f"[Guide en français]({base}/docs/user-guide.md#francais) · "
              f"[Technical reference]({base}/README.md)\n\n"
              "Windows and Linux users: choose a standalone ZIP, extract it and open ClanManager. "
              "It includes Python and needs no Docker. macOS currently uses the Docker launcher. "
              "The other platform ZIPs are complete Docker-based distributions. "
              "Extract the whole folder: the launcher is already under launch/ and both PDF guides "
              "are in docs/. No renaming or second download is needed. "
              "An API key is required. Only Docker-based downloads need Docker/virtualization.\n\n"
              "All attached files come from this tag's successful checks and four-platform build run. "
              "SHA256SUMS.txt records their checksums. Launchers are unsigned; macOS is not notarized.\n\n"
              "Back up your installation before updating. Keep .env, data, logs, and backups; "
              "use Update application after replacing source files. Startup applies database migrations.\n\n"
              "Operator acceptance was reported on October 7, 2026; retained earlier API samples "
              "remain dated evidence. Forecasting and dedicated player comparison are deferred.\n"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: complete-downloads
          path: |
            release-assets/
            release-notes.md
          if-no-files-found: error
  publish:
    name: Publish stable release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: complete-downloads
          path: .
      - name: Publish all assets together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > release-state.txt; then
            if [ "$(cat release-state.txt)" != "true" ]; then
              echo "Release already published; refusing to replace its assets."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft               --title "Clash Royale Clan Manager $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file release-notes.md
